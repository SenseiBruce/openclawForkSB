apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openclaw.name" . }}
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "openclaw.name" . }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "openclaw.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "/app/dist/index.js", "gateway", "run"]
          ports:
            - name: gateway
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: HOME
              value: /home/node
            - name: NODE_ENV
              value: production
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "openclaw.name" . }}-secrets
                  key: OPENCLAW_GATEWAY_TOKEN
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: gateway
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: gateway
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/.openclaw
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: openclaw-home
          persistentVolumeClaim:
            claimName: {{ include "openclaw.name" . }}-home
        - name: tmp
          emptyDir: {}
