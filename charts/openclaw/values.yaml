replicaCount: 1

image:
  repository: ghcr.io/openclaw/openclaw
  tag: slim
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 18789

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

persistence:
  enabled: true
  size: 10Gi
  accessMode: ReadWriteOnce

gateway:
  token: ""
  bind: loopback

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault
