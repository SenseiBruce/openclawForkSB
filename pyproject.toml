[project]
name = "openclaw-skills"
version = "0.1.0"
description = "Python helpers and skill scripts for OpenClaw"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.11.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "I"]

[tool.pytest.ini_options]
testpaths = ["skills"]
python_files = ["test_*.py"]

[tool.uv]
package = false
